<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acesso — Botiquim Bar</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#FAFAF7;--card:#FFFFFF;--border:#E8E4DC;--border2:#D8D4CC;
  --primary:#C41E1E;--primary-light:#e03030;--primary-dim:#fae8e8;
  --gold:#C9A84C;--dark:#1A1A1A;--text:#2D2D2D;--muted:#8A8A7A;
  --green:#2E7D52;--red:#C41E1E;
  --shadow:0 4px 24px rgba(0,0,0,0.08),0 1px 4px rgba(0,0,0,0.04);
}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-weight:400;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:1.5rem}
body::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--primary),var(--gold))}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:2.5rem 2rem;width:100%;max-width:400px;box-shadow:var(--shadow)}
.logo-wrap{text-align:center;margin-bottom:2rem}
.logo-img{height:72px;width:auto;object-fit:contain}
.view{display:none}.view.active{display:block;animation:fadeIn 0.3s ease}
.view-title{font-family:'Playfair Display',serif;font-size:1.25rem;color:var(--dark);margin-bottom:0.25rem}
.view-sub{font-size:0.82rem;color:var(--muted);margin-bottom:1.75rem}
.field{margin-bottom:1.1rem}
label{display:block;font-size:0.68rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:0.38rem}
input{width:100%;background:var(--bg);border:2px solid var(--border);border-radius:9px;padding:0.75rem 1rem;color:var(--dark);font-family:'DM Sans',sans-serif;font-size:0.95rem;outline:none;transition:border-color 0.2s,box-shadow 0.2s}
input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-dim)}
.btn-primary{width:100%;background:var(--primary);color:#fff;border:none;border-radius:9px;padding:0.875rem;font-family:'DM Sans',sans-serif;font-size:0.9rem;font-weight:600;cursor:pointer;transition:all 0.2s;margin-top:0.25rem;box-shadow:0 2px 8px rgba(196,30,30,0.25)}
.btn-primary:hover{background:var(--primary-light);box-shadow:0 4px 16px rgba(196,30,30,0.3);transform:translateY(-1px)}
.btn-primary:disabled{opacity:0.5;cursor:not-allowed;transform:none}
.btn-link{background:none;border:none;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:0.82rem;cursor:pointer;padding:0;transition:color 0.15s;text-decoration:underline;text-underline-offset:3px}
.btn-link:hover{color:var(--primary)}
.links-row{display:flex;justify-content:center;margin-top:1.25rem}
.alert{padding:0.75rem 1rem;border-radius:9px;font-size:0.82rem;margin-bottom:1rem;display:none;border:1px solid}
.alert.error{background:var(--primary-dim);border-color:rgba(196,30,30,0.2);color:var(--primary)}
.alert.success{background:rgba(46,125,82,0.08);border-color:rgba(46,125,82,0.2);color:#2E7D52}
.alert.visible{display:block}
.back-row{display:flex;align-items:center;gap:0.5rem;margin-bottom:1.5rem}
.back-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:1.1rem;transition:color 0.15s;padding:0}
.back-btn:hover{color:var(--primary)}
.back-label{font-size:0.75rem;color:var(--muted)}
footer{margin-top:1.5rem;font-size:0.7rem;color:var(--muted);text-align:center}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="card">
  <div class="logo-wrap">
    <img src="https://mzewaanljgofkcqetsgo.supabase.co/storage/v1/object/public/assets/Logo%20Em%20Alta%20Botiquim.png" alt="Botiquim" class="logo-img" onerror="this.style.display='none'">
  </div>

  <div class="view active" id="v-login">
    <p class="view-title">Acesso restrito</p>
    <p class="view-sub">Painel exclusivo para colaboradores do Botiquim.</p>
    <div class="alert error" id="login-error"></div>
    <div class="field"><label>E-mail</label><input type="email" id="login-email" placeholder="seu@email.com" autocomplete="email"></div>
    <div class="field"><label>Senha</label><input type="password" id="login-pass" placeholder="••••••••" autocomplete="current-password"></div>
    <button class="btn-primary" id="btn-login" onclick="doLogin()">Entrar</button>
    <div class="links-row"><button class="btn-link" onclick="showView('v-forgot')">Esqueci minha senha</button></div>
  </div>

  <div class="view" id="v-forgot">
    <div class="back-row"><button class="back-btn" onclick="showView('v-login')">←</button><span class="back-label">Voltar ao login</span></div>
    <p class="view-title">Recuperar senha</p>
    <p class="view-sub">Enviaremos um link para redefinir sua senha.</p>
    <div class="alert error" id="forgot-error"></div>
    <div class="alert success" id="forgot-success"></div>
    <div class="field"><label>E-mail cadastrado</label><input type="email" id="forgot-email" placeholder="seu@email.com"></div>
    <button class="btn-primary" id="btn-forgot" onclick="doForgot()">Enviar link de recuperação</button>
  </div>

  <div class="view" id="v-reset">
    <p class="view-title">Criar nova senha</p>
    <p class="view-sub">Escolha uma senha segura para sua conta.</p>
    <div class="alert error" id="reset-error"></div>
    <div class="field"><label>Nova senha</label><input type="password" id="reset-pass" placeholder="Mínimo 8 caracteres"></div>
    <div class="field"><label>Confirmar senha</label><input type="password" id="reset-confirm" placeholder="Repita a senha"></div>
    <button class="btn-primary" id="btn-reset" onclick="doReset()">Salvar nova senha</button>
  </div>
</div>
<footer>© 2025 Botiquim Bar · Acesso exclusivo para colaboradores</footer>

<script>
const { createClient } = supabase
const CONFIG_LOGIN = { supabaseUrl: CONFIG.supabaseUrl, supabaseKey: CONFIG.supabaseKey, painelUrl: 'botiquim-painel.html' }
const db = createClient(CONFIG_LOGIN.supabaseUrl, CONFIG_LOGIN.supabaseKey)
db.auth.getSession().then(function(r){if(r.data.session)window.location.href=CONFIG_LOGIN.painelUrl})
db.auth.onAuthStateChange(function(event){if(event==='PASSWORD_RECOVERY')showView('v-reset')})
function showView(id){document.querySelectorAll('.view').forEach(function(v){v.classList.remove('active')});document.getElementById(id).classList.add('active');clearAlerts()}
function clearAlerts(){document.querySelectorAll('.alert').forEach(function(a){a.classList.remove('visible');a.textContent=''})}
function showAlert(id,msg,type){var el=document.getElementById(id);el.textContent=msg;el.className='alert '+(type||'error')+' visible'}
function setLoading(btnId,loading,label){var btn=document.getElementById(btnId);btn.disabled=loading;if(!loading)btn.textContent=label}
async function doLogin() {
  var email=document.getElementById('login-email').value.trim(),pass=document.getElementById('login-pass').value;
  clearAlerts();if(!email||!pass){showAlert('login-error','Preencha e-mail e senha.');return}
  setLoading('btn-login',true);
  var{error}=await db.auth.signInWithPassword({email,password:pass});
  setLoading('btn-login',false,'Entrar');
  if(error){showAlert('login-error',error.message.includes('Invalid')?'E-mail ou senha incorretos.':error.message);return}
  var user=(await db.auth.getUser()).data.user
  var{data:profile}=await db.from('profiles').select('active').eq('id',user.id).single()
  if(profile&&profile.active===false){await db.auth.signOut();showAlert('login-error','Sua conta está desativada.');return}
  window.location.href=CONFIG_LOGIN.painelUrl
}
document.getElementById('login-pass').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin()})
document.getElementById('login-email').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('login-pass').focus()})
async function doForgot() {
  var email=document.getElementById('forgot-email').value.trim();
  clearAlerts();if(!email){showAlert('forgot-error','Informe seu e-mail.');return}
  setLoading('btn-forgot',true);
  var{error}=await db.auth.resetPasswordForEmail(email,{redirectTo:window.location.href});
  setLoading('btn-forgot',false,'Enviar link de recuperação');
  if(error){showAlert('forgot-error','Erro ao enviar. Verifique o e-mail.');return}
  showAlert('forgot-success','✓ Link enviado! Verifique sua caixa de entrada.','success');
}
async function doReset() {
  var pass=document.getElementById('reset-pass').value,confirm=document.getElementById('reset-confirm').value;
  clearAlerts();if(pass.length<8){showAlert('reset-error','Mínimo 8 caracteres.');return}
  if(pass!==confirm){showAlert('reset-error','As senhas não coincidem.');return}
  setLoading('btn-reset',true);
  var{error}=await db.auth.updateUser({password:pass});
  setLoading('btn-reset',false,'Salvar nova senha');
  if(error){showAlert('reset-error','Erro ao atualizar. Tente novamente.');return}
  window.location.href=CONFIG_LOGIN.painelUrl
}
</script>
</body>
</html>
